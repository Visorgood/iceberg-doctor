version = "3.11.5"
runner.dialect = scala3

# 120 is what the code already does: the longest line was 117 and nothing crossed 120.
maxColumn = 120

# No alignment. The codebase had hand-aligned `=>` and `->` columns, and `align.preset = most`
# keeps them — but it also pads arrows whose body sits on the next line, and aligns unrelated
# consecutive definitions. Aligned blocks also make diffs noisy: one longer line reindents its
# neighbours, so a one-line change reads as five. Layout is the formatter's business now.
align.preset = none

# Scaladoc here is written as prose and laid out deliberately. Format the asterisks,
# never re-wrap the sentences.
docstrings.style = SpaceAsterisk
docstrings.wrap = no

# `build.sbt` is a table of dependencies read by column, and no align preset reproduces that:
# `none` flattens it, `most` shifts group ids raggedly to line up `%` against `%%`.
# It stays hand-formatted; `scalafmtAll` covers everything under `src/`.
project.excludeFilters = ["\\.sbt$"]
